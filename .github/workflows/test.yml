name: Node tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/automation/package-lock.json
      - name: Install dependencies
        working-directory: app/automation
        run: npm ci --ignore-scripts
      - name: Run tests
        working-directory: app/automation
        run: npm test
